<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#07131d" />
    <title>Offline | Vegan Masala</title>
    <style>
      *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b1216;color:#fff;font-family:system-ui,sans-serif;padding:24px}.card{max-width:480px;border:1px solid #55482c;border-radius:24px;background:#10191e;padding:32px;text-align:center}.mark{width:72px;height:72px;object-fit:contain}.eyebrow{color:#d6b151;font-size:12px;font-weight:800;letter-spacing:.18em;text-transform:uppercase}h1{font-size:34px;margin:12px 0}p{color:#b7b9b8;line-height:1.6}.button{display:inline-block;margin-top:16px;border-radius:12px;background:#9d2f2c;color:#fff;padding:13px 20px;text-decoration:none;font-weight:800}
    </style>
  </head>
  <body>
    <main class="card">
      <img class="mark" src="/brand/logo-mark.png" alt="" />
      <p class="eyebrow">Vegan Masala</p>
      <h1>You’re offline</h1>
      <p>Your saved planner screens and previously opened cooking recipes remain available. Reconnect once to make a new page available offline.</p>
      <a class="button" href="/meal-planner">Open my planner</a>
    </main>
  </body>
</html>
